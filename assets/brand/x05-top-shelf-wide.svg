  </g>

  <!-- Lockup, optically centred as a whole. -->
  <g transform="translate(795 0)">
    <g transform="translate(130 360) scale(0.255) translate(-512 -512)">
      
  <path d="M232 186 L404 186 L792 838 L620 838 Z" fill="url(#barA)"/>
  <path d="M620 186 L792 186 L404 838 L232 838 Z" fill="url(#barB)"/>
      <circle cx="512" cy="512" r="176" fill="#05080F"/>
      <circle cx="512" cy="512" r="176" fill="none" stroke="#8FC4FF" stroke-opacity=".42" stroke-width="3"/>
      <path d="M466 430 L466 594 L630 512 Z" fill="#EAF4FF"/>
    </g>
    <rect x="292" y="242" width="2" height="236" rx="1" fill="url(#wline)"/>
    <text x="330" y="410" font-family="'Arial Black','Segoe UI',sans-serif"
          font-weight="900" font-style="italic" font-size="152" letter-spacing="-3"
          fill="url(#wgrad)">X05</text>
    <text x="336" y="474" font-family="'Segoe UI',Arial,sans-serif" font-weight="700"
