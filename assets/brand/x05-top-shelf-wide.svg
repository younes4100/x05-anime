      <stop offset=".5" stop-color="#1677FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2320" height="720" fill="url(#bg)"/>
  <rect width="2320" height="720" fill="url(#glow)"/>
  <g opacity=".15" stroke="#7CBBFF" stroke-width="1.6">
    <path d="M-80 860 L2100 -40"/>
    <path d="M-80 960 L2100 60"/>
  </g>
  <circle cx="1630" cy="360" r="330" fill="url(#edge)"/>
  <g transform="rotate(-28 1630 360)">
