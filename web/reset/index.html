<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Reset password — X05 ANIME</title><link rel="icon" href="../favicon.png" /><link rel="stylesheet" href="../css/style.css" />
  <style>.auth-wrap{min-height:calc(100vh - 40px)}</style>
</head>
<body>
  <div class="auth-wrap"><div class="auth-card">
    <div class="brand" style="text-align:center">X05 <span>ANIME</span></div>
    <p class="lead" style="text-align:center;font-size:14px" id="subtitle">استعادة كلمة المرور / Reset password</p>
    <div id="requestBox">
      <label for="email">البريد الإلكتروني / Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      <p style="margin-top:18px"><button id="sendBtn" class="btn btn-primary" style="width:100%">إرسال رابط الاستعادة / Send reset link</button></p>
    </div>
    <div id="updateBox" class="hidden">
      <label for="pw">كلمة المرور الجديدة / New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
      <label for="pw2">تأكيد كلمة المرور / Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" />
      <p style="margin-top:18px"><button id="updateBtn" class="btn btn-primary" style="width:100%">تحديث كلمة المرور / Update password</button></p>
    </div>
    <div id="msg" class="msg"></div>
    <p style="text-align:center;margin-top:18px"><a href="../index.html" style="color:var(--muted)">← الرئيسية / Home</a></p>
  </div></div>

  <script src="../vendor/supabase.min.js"></script>
  <script src="../config.js"></script>
  <script src="../js/reset-page.js"></script>
</body>
</html>
